<!DOCTYPE html>
<!--
  index.html — Pantalla de «Mi fichaje».
  Fichaje con foto: cada entrada y salida es una foto hecha en el momento,
  con fecha, hora y ubicación GPS grabadas en la imagen y en sus metadatos.
  Lógica en app.js · Aspecto en styles.css · Metodología en README.md
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichaje">
<meta name="theme-color" content="#2B4C7E">
<title>Mi fichaje</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section class="card" id="card" aria-live="polite">
    <div class="date" id="date"></div>
    <div class="time" id="time">--:--</div>
    <div class="status" id="status"></div>
    <button id="punch" class="punch">📷 Fichar entrada</button>
    <div id="msg" class="msg"></div>
  </section>
  <input type="file" id="cam" accept="image/*" capture="environment">

  <div class="totals">
    <div class="tot"><span>Hoy</span><strong id="tToday">0:00</strong></div>
    <div class="tot"><span>Semana</span><strong id="tWeek">0:00</strong></div>
    <div class="tot"><span>Mes</span><strong id="tMonth">0:00</strong></div>
  </div>

  <div id="history"></div>

  <footer class="foot">
    <a href="#" id="export">Exportar registro</a> · <a href="verificar.html">Verificar</a> · <a href="https://github.com/marccbalaguerr/fichaje#readme">Cómo funciona</a>
  </footer>
</main>

<!-- Resultado tras hacer la foto -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-in">
    <img id="preview" alt="Foto del fichaje">
    <div id="sheetText" class="sheet-text"></div>
    <button id="saveBtn" class="punch">Guardar en Fotos</button>
    <button id="closeBtn" class="link">Hecho</button>
  </div>
</div>

<!-- Librería MIT para escribir metadatos EXIF (ver lib/piexif-LICENSE.txt) -->
<script src="lib/piexif.js"></script>
<script src="app.js"></script>
</body>
</html>
